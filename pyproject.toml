[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuc2d"
version = "0.6.0"
description = "Nuc2D visualizes RNA and DNA secondary structures as publication-ready SVG images."
authors = [
  { name = "Soma Ishii" }
]
requires-python = ">=3.10"

license = "MIT"
readme = "README.md"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

keywords = [
  "nucleic acid",
  "RNA",
  "DNA",
  "secondary structure",
  "visualization",
]

dependencies = [
  "numpy>=2.2",
  "matplotlib>=3.10",
  # svgwrite types are part of the public API, so a major release of it
  # would be a major release here.
  "svgwrite>=1.4,<2",
  "fonttools>=4.65",
]

[dependency-groups]
dev = [
  "cairosvg>=2.9.1",
  "ipykernel>=7.3.0",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuc2d = ["py.typed"]

[project.urls]
Repository = "https://github.com/Soma-yu/nuc2d"
Changelog = "https://github.com/Soma-yu/nuc2d/releases"
