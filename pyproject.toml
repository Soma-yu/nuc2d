[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuc2d"
version = "0.5.0"
description = "Nuc2D visualizes RNA and DNA secondary structures as publication-ready SVG images."
authors = [
  { name = "Soma Ishii" }
]
requires-python = ">=3.10"

license = "MIT"
readme = "README.md"

keywords = [
  "nucleic acid",
  "RNA",
  "DNA",
  "secondary structure",
  "visualization",
]

dependencies = [
  "numpy",
  "matplotlib",
  "svgwrite",
  "fonttools",
]

[dependency-groups]
dev = [
  "cairosvg>=2.9.1",
  "ipykernel>=7.3.0",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/Soma-yu/nuc2d"
